# 管理画面（Firestore menus）の値段・メニューをホームページへ反映する。1時間ごと＋手動。
# 中身は tools/prices/build.mjs。変わった時だけ commit → GitHub Pages が公開し直す。
name: prices-from-admin
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [menus-changed]
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: build
        id: build
        run: |
          set +e
          node tools/prices/build.mjs | tee build.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: commit
        run: |
          rm -f build.log
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "ciel-prices-bot"
            git config user.email "prices-bot@users.noreply.github.com"
            git add -A
            git commit -m "prices: 管理画面の値段・メニューを反映 ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
      - name: report
        if: steps.build.outputs.code != '0'
        run: |
          echo "::warning::孤立/壊れた値段の配線があります。data/price-report.json を確認してください"
          cat data/price-report.json
