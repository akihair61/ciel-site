# Builds and tests the iOS code on GitHub's macOS runner (the working container has no Swift toolchain).
# Runs only for the currency-intelligence branch; does not touch main or Pages.
name: ios-currency-intelligence
on:
  push:
    branches: [currency-intelligence]
    paths: ["currency-intelligence/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: write # the app-build job commits the simulator screenshot and build summary to this branch
jobs:
  core-tests:
    name: CoreMoney swift test
    runs-on: macos-15
    defaults: { run: { working-directory: currency-intelligence/ios/CoreMoney } }
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: |
          set -o pipefail
          swift test 2>&1 | tee ../../../swift-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: swift-test-log, path: swift-test.log }
  app-build:
    name: xcodebuild (iOS Simulator)
    runs-on: macos-15
    defaults: { run: { working-directory: currency-intelligence/ios/CurrencyIntelligence } }
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: xcodebuild -list -project CurrencyIntelligence.xcodeproj
      - name: Pick an installed simulator
        id: sim
        run: |
          xcrun simctl list runtimes
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; import re; c=[x for k,v in d.items() if "iOS" in k for x in v if re.match(r"iPhone \\d+", x["name"])]; c.sort(key=lambda x: (int(re.search(r"\\d+", x["name"]).group()), "Pro" in x["name"], x["name"])); print(c[-1]["udid"] if c else "")')
          echo "udid: $UDID"; test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project CurrencyIntelligence.xcodeproj -scheme CurrencyIntelligence \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" -configuration Debug -derivedDataPath ../../../dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee ../../../xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" ../../../xcodebuild.log
      - name: Launch in the simulator and take a screenshot
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find ../../../dd/Build/Products -name "CurrencyIntelligence.app" -maxdepth 3 | head -1); echo "app: $APP"; test -n "$APP"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.akihair.currencyintelligence
          sleep 8
          mkdir -p ../../../shots
          xcrun simctl io "$UDID" screenshot ../../../shots/ios-home.png
          xcrun simctl terminate "$UDID" com.akihair.currencyintelligence || true
          ls -la ../../../shots
      - name: UI smoke test (XCUITest) with screenshots
        run: |
          set -o pipefail
          rm -rf /tmp/ci-shots; mkdir -p /tmp/ci-shots
          xcodebuild test -project CurrencyIntelligence.xcodeproj -scheme CurrencyIntelligence \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" -derivedDataPath ../../../dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee ../../../xctest.log | grep -E "Test Case|error:|\*\* TEST|Executed" || true
          grep -q "TEST SUCCEEDED" ../../../xctest.log
          cp /tmp/ci-shots/*.png ../../../shots/ 2>/dev/null || true
          ls -la ../../../shots
      - name: Commit the screenshot and build summary to the branch
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p currency-intelligence/docs/screenshots/ios currency-intelligence/docs/ci
          cp shots/*.png currency-intelligence/docs/screenshots/ios/
          { echo "run: $GITHUB_RUN_ID  commit: $GITHUB_SHA  date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"; xcodebuild -version; echo; grep -E "warning:|error:|BUILD" xcodebuild.log | sed 's#/Users/runner/work/ciel-site/ciel-site/##' | sort | uniq -c; echo; echo "UI tests:"; grep -E "Test Case .* (passed|failed)|Executed|TEST (SUCCEEDED|FAILED)" xctest.log | sed 's/^.*Test Case/Test Case/' | sort | uniq; } > currency-intelligence/docs/ci/ios-build-summary.txt
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add currency-intelligence/docs/screenshots/ios currency-intelligence/docs/ci
          git commit -m "ci: iOS simulator screenshot and build summary (run $GITHUB_RUN_ID)" || exit 0
          git pull --rebase origin currency-intelligence
          git push origin HEAD:currency-intelligence
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-screenshots, path: shots/ }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: xcodebuild-log, path: xcodebuild.log }
