# Builds and tests the iOS code on GitHub's macOS runner (the working container has no Swift toolchain).
# Runs only for the currency-intelligence branch; does not touch main or Pages.
name: ios-currency-intelligence
on:
  push:
    branches: [currency-intelligence]
    paths: ["currency-intelligence/ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    name: CoreMoney swift test
    runs-on: macos-15
    defaults: { run: { working-directory: currency-intelligence/ios/CoreMoney } }
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || true
      - run: swift --version
      - run: swift build
      - run: |
          set -o pipefail
          swift test 2>&1 | tee ../../../swift-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: swift-test-log, path: swift-test.log }
  app-build:
    name: xcodebuild (iOS Simulator)
    runs-on: macos-15
    defaults: { run: { working-directory: currency-intelligence/ios/CurrencyIntelligence } }
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.2.app || sudo xcode-select -s /Applications/Xcode_16.1.app || true
      - run: xcodebuild -version
      - run: xcodebuild -list -project CurrencyIntelligence.xcodeproj
      - run: |
          set -o pipefail
          xcodebuild -project CurrencyIntelligence.xcodeproj -scheme CurrencyIntelligence \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee ../../../xcodebuild.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)|\*\* " || true
          grep -q "BUILD SUCCEEDED" ../../../xcodebuild.log
      - name: Launch in the simulator and take screenshots
        run: |
          set -o pipefail
          xcodebuild -project CurrencyIntelligence.xcodeproj -scheme CurrencyIntelligence \
            -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath ../../../dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | grep -E "error:|BUILD" || true
          APP=$(find ../../../dd/Build/Products -name "CurrencyIntelligence.app" -maxdepth 3 | head -1); echo "app: $APP"; test -n "$APP"
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[x for k,v in d.items() if "iOS" in k for x in v if x["name"] in ("iPhone 16","iPhone 16 Pro","iPhone 15")]; print(c[0]["udid"] if c else "")')
          echo "udid: $UDID"; test -n "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.akihair.currencyintelligence
          sleep 8
          mkdir -p ../../../shots
          xcrun simctl io "$UDID" screenshot ../../../shots/ios-home.png
          xcrun simctl terminate "$UDID" com.akihair.currencyintelligence || true
          ls -la ../../../shots
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: ios-screenshots, path: shots/ }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: xcodebuild-log, path: xcodebuild.log }
