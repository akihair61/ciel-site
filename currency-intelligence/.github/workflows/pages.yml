# Deploys apps/web to GitHub Pages. Needs Pages enabled with source "GitHub Actions"
# (Settings → Pages → Build and deployment → Source: GitHub Actions).
name: deploy-web
on:
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/core/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm --prefix packages/core test
      - run: npm --prefix packages/core run build
      - run: node apps/web/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with: { path: apps/web }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
